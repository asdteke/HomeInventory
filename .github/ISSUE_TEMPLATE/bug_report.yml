name: Bug report
description: Report a reproducible HomeInventory bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve HomeInventory.

        If this report involves a private security vulnerability, do not open a public issue. Please follow the responsible disclosure process in `SECURITY.md`.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke or behaved unexpectedly?
      placeholder: Describe the problem in one or two paragraphs.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication / Login
        - 2FA / Account Recovery
        - Items / Inventory Management
        - Borrowing System
        - Uploads / Media Library
        - Backup / Restore
        - Admin Dashboard
        - Localization / Translations
        - Frontend / UI / Mobile View
        - API / Backend
        - Docker / Self-Hosting
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Submit ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share enough detail for maintainers to reproduce the issue.
      placeholder: |
        - OS:
        - Browser:
        - App mode: Local dev / Docker / production
        - Version or commit:

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or attach screenshots. Remove secrets, tokens, emails, addresses, and personal inventory data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first.
          required: true
        - label: I removed sensitive personal data, secrets, and tokens from logs/screenshots.
          required: true
        - label: This is not a private security vulnerability report.
          required: true

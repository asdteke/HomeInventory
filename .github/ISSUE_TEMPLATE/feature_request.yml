name: Feature request
description: Propose an improvement to HomeInventory.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Clear problem statements help keep HomeInventory focused, secure, and practical for self-hosted households.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What workflow gap, user need, or pain point does this address?
      placeholder: Describe the problem before describing the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this work from the user's perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround do you use today, or what other approach did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Relevant area
      options:
        - Items / Inventory Management
        - Borrowing System
        - Authentication / Account Settings
        - Security / Privacy
        - Admin Dashboard
        - Localization / Translations
        - Mobile / Responsive Design
        - PWA / Offline Mode
        - Backup / Restore
        - Docker / Self-Hosting
        - API / Third-Party Integrations
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits, and how does this improve daily use or self-hosting?

  - type: textarea
    id: security
    attributes:
      label: Security and privacy considerations
      description: Could this affect authentication, household scoping, encryption, backups, uploads, or personal data?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first.
          required: true
        - label: I described the problem, not only a preferred implementation.
          required: true

name: CI

# Current for the public v2.7.4 release line.

on:
  pull_request:
  push:
    branches:
      - main
      - new-design-rebuild

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            apps/launcher/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install launcher dependencies
        run: npm ci --prefix apps/launcher

      - name: Validate JSON files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const files = execSync('git ls-files "*.json"', { encoding: 'utf8' })
            .trim()
            .split(/\n/)
            .filter(Boolean);
          const failures = [];
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (error) {
              failures.push(`${file}: ${error.message}`);
            }
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Validated ${files.length} JSON files.`);
          NODE

      - name: Validate locale parity and artifacts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const artifactPattern = /QX7|QUERY LENGTH LIMIT EXCEEDED|<<<|<<|__HI_(?!PH_)[A-Z0-9_]+|HI_(?!PH_)[A-Z0-9_]+/i;
          const localeDirs = [
            ['client/public/locales', 'client/public/locales/en/translation.json']
          ];

          function collectStringPaths(value, prefix = '') {
            if (Array.isArray(value)) {
              return value.flatMap((item, index) => collectStringPaths(item, `${prefix}[${index}]`));
            }
            if (value && typeof value === 'object') {
              return Object.entries(value).flatMap(([key, child]) => {
                const next = prefix ? `${prefix}.${key}` : key;
                return collectStringPaths(child, next);
              });
            }
            return typeof value === 'string' ? [prefix] : [];
          }

          const failures = [];
          for (const [dir, baseFile] of localeDirs) {
            const base = new Set(collectStringPaths(JSON.parse(fs.readFileSync(baseFile, 'utf8'))));
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const file = path.join(dir, entry.name, 'translation.json');
              if (!fs.existsSync(file)) continue;
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const current = new Set(collectStringPaths(data));
              const missing = [...base].filter((key) => !current.has(key));
              const extra = [...current].filter((key) => !base.has(key));
              if (missing.length || extra.length) {
                failures.push(`${file}: missing ${missing.length}, extra ${extra.length}`);
              }
              const serialized = JSON.stringify(data);
              if (artifactPattern.test(serialized)) {
                failures.push(`${file}: translation artifact marker detected`);
              }
            }
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Locale parity and artifact checks passed.');
          NODE

      - name: Validate i18n completeness and source usage
        run: npm run i18n:check

      - name: Validate app and launcher version parity
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Build launcher frontend
        run: npm run build --prefix apps/launcher

      - name: Build and verify managed app archive
        run: |
          npm run launcher:bundle-app
          node scripts/verify-managed-app-archive.mjs

      - name: Test Node application
        run: node --test --test-concurrency=1 tests/*.test.mjs

      - name: Test Rust launcher
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo test --locked --manifest-path apps/launcher/src-tauri/Cargo.toml

      - name: Audit moderate severity dependencies
        run: npm audit --audit-level=moderate

      - name: Audit client moderate severity dependencies
        run: npm audit --audit-level=moderate --prefix client

      - name: Audit launcher moderate severity dependencies
        run: npm audit --audit-level=moderate --prefix apps/launcher

  docker:
    name: Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: homeinventory:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Verify bundled dependencies load offline
        run: |
          docker run --rm --network none --platform ${{ matrix.platform }} --entrypoint node homeinventory:ci -e "
            require('uuid'); require('better-sqlite3'); require('bcrypt'); require('sharp');
            Promise.all([import('oci-common'), import('oci-secrets')])
              .then(() => console.log('All runtime dependencies load without network access.'))
              .catch((error) => { console.error(error); process.exit(1); });
          "

      - name: Start container without network and check health
        run: |
          docker run -d --name hi-smoke --network none --platform ${{ matrix.platform }} \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e APP_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e APP_ENCRYPTION_KEY_ID=ci \
            homeinventory:ci
          for attempt in $(seq 1 60); do
            if docker exec hi-smoke node -e "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "Health check passed."
              docker logs hi-smoke | tail -n 20
              exit 0
            fi
            sleep 2
          done
          docker logs hi-smoke
          exit 1

      - name: Report image size
        if: always()
        run: docker image ls homeinventory:ci

name: Launcher Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "launcher-v*"

permissions:
  contents: write

jobs:
  package:
    name: Build launcher packages (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            bundles: app
          - name: windows
            os: windows-latest
            bundles: nsis,msi
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install launcher dependencies
        run: npm ci --prefix apps/launcher

      - name: Build launcher frontend
        run: npm --prefix apps/launcher run build

      - name: Build Tauri launcher
        run: npm --prefix apps/launcher run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Package macOS artifacts
        if: matrix.name == 'macos'
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent \
            "apps/launcher/src-tauri/target/release/bundle/macos/HomeInventory Launcher.app" \
            "artifacts/HomeInventory Launcher-macos.app.zip"
          hdiutil create \
            -volname "HomeInventory Launcher" \
            -srcfolder "apps/launcher/src-tauri/target/release/bundle/macos/HomeInventory Launcher.app" \
            -ov \
            -format UDZO \
            "artifacts/HomeInventory Launcher-macos.dmg"
          hdiutil verify "artifacts/HomeInventory Launcher-macos.dmg"

      - name: Collect Windows artifacts
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "apps\launcher\src-tauri\target\release\bundle\nsis\*.exe" artifacts -ErrorAction SilentlyContinue
          Copy-Item "apps\launcher\src-tauri\target\release\bundle\msi\*.msi" artifacts -ErrorAction SilentlyContinue

      - name: Collect Linux artifacts
        if: matrix.name == 'linux'
        run: |
          mkdir -p artifacts
          find apps/launcher/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} artifacts/ \;

      - name: List artifacts
        run: ls -la artifacts

      - name: Upload launcher packages
        uses: actions/upload-artifact@v4
        with:
          name: homeinventory-launcher-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Attach launcher packages to GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download launcher artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: homeinventory-launcher-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

name: Launcher Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach artifacts to a GitHub Release"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to use when publish_release is true, for example v2.7.0"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22.22.0"

jobs:
  managed-app:
    name: Build managed app archive
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Validate app and launcher version parity
        run: npm run version:check

      - name: Build client
        run: npm run build --prefix client

      - name: Resolve release metadata
        id: version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            SHOULD_PUBLISH="true"
          else
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
            SHOULD_PUBLISH="${{ github.event.inputs.publish_release }}"
          fi

          if [[ "${SHOULD_PUBLISH}" == "true" && -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="v${APP_VERSION}"
          fi

          if [[ "${SHOULD_PUBLISH}" == "true" && "${RELEASE_TAG}" != "v${APP_VERSION}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match app and launcher version v${APP_VERSION}."
            exit 1
          fi

          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"

      - name: Build bundled HomeInventory archive
        run: npm run launcher:bundle-app

      - name: Create signed managed app manifest
        shell: bash
        env:
          HOMEINVENTORY_APP_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.HOMEINVENTORY_APP_MANIFEST_PRIVATE_KEY_PEM }}
        run: |
          if [[ "${{ steps.version.outputs.should_publish }}" != "true" ]]; then
            echo "Skipping managed app manifest for non-publishing package build."
            exit 0
          fi

          if [[ -z "${HOMEINVENTORY_APP_MANIFEST_PRIVATE_KEY_PEM}" ]]; then
            echo "::error::HOMEINVENTORY_APP_MANIFEST_PRIVATE_KEY_PEM is required for release publishing."
            exit 1
          fi

          node scripts/create-app-release-manifest.mjs \
            --version "${{ steps.version.outputs.app_version }}" \
            --archive apps/launcher/src-tauri/resources/homeinventory-app.tar.gz \
            --url "https://github.com/asdteke/HomeInventory/releases/download/${{ steps.version.outputs.release_tag }}/homeinventory-app.tar.gz" \
            --node-major 22 \
            --output dist/release/homeinventory-app-manifest.json

          node -e "const m=require('./dist/release/homeinventory-app-manifest.json'); if (!m.signatureV2 || m.signatureV2 === 'unsigned') throw new Error('Managed app manifest is not signed')"

      - name: Stage managed app artifacts
        shell: bash
        run: |
          mkdir -p dist/managed-app
          cp apps/launcher/src-tauri/resources/homeinventory-app.tar.gz dist/managed-app/homeinventory-app.tar.gz
          if [[ -f dist/release/homeinventory-app-manifest.json ]]; then
            cp dist/release/homeinventory-app-manifest.json dist/managed-app/homeinventory-app-manifest.json
          fi

      - name: Upload managed app archive
        uses: actions/upload-artifact@v4
        with:
          name: homeinventory-managed-app
          path: dist/managed-app/*
          if-no-files-found: warn

  package:
    name: Build launcher packages (${{ matrix.name }})
    needs: managed-app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            bundles: app,dmg
            tauri_platform: darwin-aarch64
            tauri_target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-14
            bundles: app,dmg
            tauri_platform: darwin-x86_64
            tauri_target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis,msi
            tauri_platform: windows-x86_64
            tauri_target: ""
          - name: linux-x86_64
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            tauri_platform: linux-x86_64
            tauri_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.tauri_target != ''
        run: rustup target add ${{ matrix.tauri_target }}

      - name: Install Linux Tauri dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Download managed app archive
        uses: actions/download-artifact@v4
        with:
          name: homeinventory-managed-app
          path: apps/launcher/src-tauri/resources

      - name: Verify launcher signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ "${{ needs.managed-app.outputs.should_publish }}" == "true" && -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for a synchronized release."
            exit 1
          elif [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is missing. This non-release build will not produce updater artifacts."
          fi

      - name: Install launcher dependencies
        run: npm ci --prefix apps/launcher

      - name: Build launcher frontend
        run: npm --prefix apps/launcher run build

      - name: Resolve macOS signing mode
        id: mac-signing
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          if [[ -n "${APPLE_CERTIFICATE_P12_BASE64}" && -n "${APPLE_CERTIFICATE_PASSWORD}" && -n "${APPLE_DEVELOPER_ID_APPLICATION}" ]]; then
            echo "mode=developer-id" >> "${GITHUB_OUTPUT}"
            echo "Using Developer ID signing for macOS app."
          else
            echo "mode=ad-hoc" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple Developer ID signing secrets are missing. Using ad-hoc macOS signing."
          fi

          if [[ -n "${APPLE_CERTIFICATE_P12_BASE64}" && -n "${APPLE_CERTIFICATE_PASSWORD}" && -n "${APPLE_DEVELOPER_ID_APPLICATION}" && -n "${APPLE_NOTARY_KEY_ID}" && -n "${APPLE_NOTARY_ISSUER_ID}" && -n "${APPLE_NOTARY_KEY_P8}" ]]; then
            echo "can_notarize=true" >> "${GITHUB_OUTPUT}"
          else
            echo "can_notarize=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple notarization secrets are missing. macOS DMG will not be notarized."
          fi

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.name, 'macos-') && steps.mac-signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/homeinventory-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/homeinventory-developer-id.p12"
          export CERTIFICATE_PATH
          python3 -c "import base64, os, pathlib; pathlib.Path(os.environ['CERTIFICATE_PATH']).write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE_P12_BASE64']))"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

      - name: Build Tauri launcher
        working-directory: apps/launcher
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          TAURI_ARGS=(node_modules/@tauri-apps/cli/tauri.js build --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.tauri_target }}" ]; then
            TAURI_ARGS+=(--target "${{ matrix.tauri_target }}")
          fi

          if [[ "${{ matrix.name }}" == macos-* ]]; then
            TAURI_SIGNING_CONFIG_PATH="${RUNNER_TEMP}/homeinventory-tauri-macos-signing.json"
            export TAURI_SIGNING_CONFIG_PATH
            node -e "require('node:fs').writeFileSync(process.env.TAURI_SIGNING_CONFIG_PATH, JSON.stringify({ bundle: { macOS: { signingIdentity: process.env.APPLE_DEVELOPER_ID_APPLICATION || '-' } } }))"
            TAURI_ARGS+=(--config "${TAURI_SIGNING_CONFIG_PATH}")
          fi

          node "${TAURI_ARGS[@]}"

      - name: Verify macOS application and updater signatures
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          TARGET_DIR="apps/launcher/src-tauri/target"
          if [ -n "${{ matrix.tauri_target }}" ]; then
            TARGET_DIR="apps/launcher/src-tauri/target/${{ matrix.tauri_target }}"
          fi
          APP_PATH="$TARGET_DIR/release/bundle/macos/HomeInventory Launcher.app"
          xattr -cr "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH"

          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            UPDATER_ARCHIVE="$(find "$TARGET_DIR/release/bundle" -type f -name '*.app.tar.gz' -print -quit)"
            if [[ -z "${UPDATER_ARCHIVE}" ]]; then
              echo "::error::macOS updater archive was not generated."
              exit 1
            fi

            UPDATER_DIR="$(mktemp -d)"
            tar -xzf "${UPDATER_ARCHIVE}" -C "${UPDATER_DIR}"
            UPDATER_APP="$(find "${UPDATER_DIR}" -type d -name '*.app' -print -quit)"
            if [[ -z "${UPDATER_APP}" ]]; then
              echo "::error::macOS updater archive does not contain an application bundle."
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "${UPDATER_APP}"
            APP_SIGNATURE="$(codesign --display --verbose=4 "$APP_PATH" 2>&1)"
            UPDATER_SIGNATURE="$(codesign --display --verbose=4 "${UPDATER_APP}" 2>&1)"
            APP_CDHASH="$(printf '%s\n' "${APP_SIGNATURE}" | sed -n 's/^CDHash=//p')"
            UPDATER_CDHASH="$(printf '%s\n' "${UPDATER_SIGNATURE}" | sed -n 's/^CDHash=//p')"
            if [[ -z "${APP_CDHASH}" || "${APP_CDHASH}" != "${UPDATER_CDHASH}" ]]; then
              echo "::error::macOS updater archive was not created from the signed application bundle."
              exit 1
            fi

            if [[ "${{ steps.mac-signing.outputs.mode }}" == "developer-id" ]] \
              && ! grep -Fq "Authority=${APPLE_DEVELOPER_ID_APPLICATION}" <<< "${UPDATER_SIGNATURE}"; then
              echo "::error::macOS updater archive is not signed with the configured Developer ID."
              exit 1
            fi
            rm -rf "${UPDATER_DIR}"
          fi

      - name: Collect distributable packages
        shell: bash
        run: |
          mkdir -p artifacts
          TARGET_DIR="apps/launcher/src-tauri/target"
          if [ -n "${{ matrix.tauri_target }}" ]; then
            TARGET_DIR="apps/launcher/src-tauri/target/${{ matrix.tauri_target }}"
          fi
          if [[ "${{ matrix.name }}" == macos-* ]]; then
            DMG_SOURCE="$(find "$TARGET_DIR/release/bundle" -type f -name '*.dmg' -print -quit)"
            if [[ -z "${DMG_SOURCE}" ]]; then
              echo "::error::Tauri did not create the configured macOS DMG."
              exit 1
            fi
            cp "${DMG_SOURCE}" \
              "artifacts/HomeInventory Launcher_${{ needs.managed-app.outputs.app_version }}_${{ matrix.tauri_platform }}.dmg"
          else
            find "$TARGET_DIR/release/bundle" -type f \
              \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
              -exec cp {} artifacts/ \;
          fi

      - name: Notarize macOS DMG
        if: startsWith(matrix.name, 'macos-') && needs.managed-app.outputs.should_publish == 'true' && steps.mac-signing.outputs.can_notarize == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          DMG_PATH="artifacts/HomeInventory Launcher_${{ needs.managed-app.outputs.app_version }}_${{ matrix.tauri_platform }}.dmg"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_ID_APPLICATION" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Collect updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            if [[ "${{ needs.managed-app.outputs.should_publish }}" == "true" ]]; then
              echo "::error::Signed updater artifacts are mandatory for release publishing."
              exit 1
            else
              echo "Skipping updater artifacts collection for a non-release build."
              exit 0
            fi
          fi
          TARGET_DIR="apps/launcher/src-tauri/target"
          if [ -n "${{ matrix.tauri_target }}" ]; then
            TARGET_DIR="apps/launcher/src-tauri/target/${{ matrix.tauri_target }}"
          fi
          node scripts/collect-tauri-updater-artifacts.mjs \
            --platform "${{ matrix.tauri_platform }}" \
            --version "${{ needs.managed-app.outputs.app_version }}" \
            --bundle-dir "$TARGET_DIR/release/bundle" \
            --output-dir artifacts

      - name: List artifacts
        shell: bash
        run: ls -la artifacts

      - name: Upload launcher packages
        uses: actions/upload-artifact@v4
        with:
          name: homeinventory-launcher-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Attach launcher packages to GitHub Release
    needs:
      - managed-app
      - package
    if: needs.managed-app.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download launcher artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: homeinventory-launcher-*
          path: release-assets
          merge-multiple: true

      - name: Download managed app artifacts
        uses: actions/download-artifact@v4
        with:
          name: homeinventory-managed-app
          path: release-assets

      - name: Create Tauri latest.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to publish latest.json."
            exit 1
          fi
          node scripts/create-tauri-latest-json.mjs \
            --assets-dir release-assets \
            --output release-assets/latest.json \
            --version "${{ needs.managed-app.outputs.app_version }}" \
            --release-tag "${{ needs.managed-app.outputs.release_tag }}" \
            --base-url "https://github.com/asdteke/HomeInventory/releases/download/${{ needs.managed-app.outputs.release_tag }}" \
            --notes "HomeInventory Launcher ${{ needs.managed-app.outputs.app_version }}"

      - name: Verify synchronized release assets
        run: |
          node scripts/verify-tauri-release-assets.mjs \
            --assets-dir release-assets \
            --version "${{ needs.managed-app.outputs.app_version }}"

      - name: Stage focused public release assets
        run: |
          node scripts/stage-public-release-assets.mjs \
            --source release-assets \
            --output public-release-assets \
            --version "${{ needs.managed-app.outputs.app_version }}"
          node scripts/verify-tauri-release-assets.mjs \
            --assets-dir public-release-assets \
            --version "${{ needs.managed-app.outputs.app_version }}" \
            --public

      - name: List release assets
        run: ls -la public-release-assets

      - name: Replace existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.managed-app.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.managed-app.outputs.release_tag }}
          name: HomeInventory ${{ needs.managed-app.outputs.release_tag }}
          body: |
            ## HomeInventory v2.7.0

            This feature release adds optional domain-free LAN HTTPS for mobile camera access, platform-specific certificate enrollment, larger QR codes, five launcher languages, random-port selection, practical password rules, offline weak-password blocking, progressive account throttling, and the v2.7 interface and Personal Vault polish.

            Android Chrome camera access was verified on a physical device. iOS enrollment guidance and simulator behavior were reviewed, but physical-device Safari validation remains a documented limitation for this release.

            ## Recommended downloads

            - **macOS (Apple Silicon):** the `darwin-aarch64.dmg` file
            - **macOS (Intel):** the `darwin-x86_64.dmg` file
            - **Windows:** use `.exe`; `.msi` is also available
            - **Linux:** use `.AppImage`; `.deb` and `.rpm` are also available

            The remaining archive and metadata files are used automatically by HomeInventory updates.

            ## Upgrade notes

            - Back up the SQLite database and uploads before upgrading a self-hosted installation.
            - Rebuild the client and refresh the PWA/service worker after upgrading.
            - Flash and zoom availability depends on the mobile browser and camera hardware; unsupported controls remain disabled.
            - See `CHANGELOG.md` in the source archive for the complete patch notes.
          files: public-release-assets/*

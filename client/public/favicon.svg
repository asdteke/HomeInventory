<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      color-scheme: light dark;
    }

    .canvas {
      fill: #ffffff;
    }

    .frame,
    .box {
      fill: none;
      stroke: #0f2342;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .accent {
      fill: none;
      stroke: #ff8a1d;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    @media (prefers-color-scheme: dark) {
      .canvas {
        fill: #111827;
      }

      .frame,
      .box {
        stroke: #ffffff;
      }
    }
  </style>

  <rect class="canvas" width="64" height="64" rx="14" />

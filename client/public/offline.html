<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>Inventory Offline</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.16), transparent 40%),
        linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    main {
      width: min(92vw, 32rem);
      padding: 2rem;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
      color: #334155;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
      padding: 0.85rem 1.2rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
    }
  </style>
</head>

<body>
  <main>
    <h1>You're offline</h1>
    <p>The app shell is available, but live inventory data stays on the server and needs a connection to refresh securely.</p>
    <p>Reconnect to continue syncing items, account state, and vault data.</p>
    <a href="/">Try again</a>
  </main>
</body>

</html>
